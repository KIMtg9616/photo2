<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <!--
    스마트폰 화면 대응
    viewport-fit=cover:
    iPhone 노치 / Dynamic Island / Safe Area 대응
  -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">

  <!-- iOS 웹앱 대응 -->
  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <title>캐릭터 포토</title>

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="./css/style.css"
  >

</head>


<body>


  <!-- =========================================================
       전체 앱
       ========================================================= -->

  <main class="app">


    <!-- =========================================================
         상단 로고
         ========================================================= -->

    <header class="top-header">

      <img
        src="./assets/logo/logo.png"
        alt="희망의 과학싹잔치 로고"
        class="main-logo"
      >

    </header>



    <!-- =========================================================
         카메라 영역

         - 화면 비율 4:3
         - 스마트폰 전면 카메라
         - 선택된 이미지가 카메라 위에 표시됨
         ========================================================= -->

    <section class="camera-section">


      <div
        id="cameraStage"
        class="camera-stage"
      >


        <!-- 실시간 카메라 -->

        <video
          id="cameraVideo"
          autoplay
          playsinline
          muted
        ></video>



        <!--
          선택한 정적 배경 이미지

          현재 1차 버전에서는
          사람만 따로 인식하여 배경을 제거하지 않습니다.

          따라서 중앙이 투명한 PNG/WebP 프레임을
          사용하는 것이 적합합니다.
        -->

        <img
          id="backgroundOverlay"
          class="background-overlay"
          alt=""
          aria-hidden="true"
        >



        <!-- 촬영 플래시 -->

        <div
          id="cameraFlash"
          class="camera-flash"
          aria-hidden="true"
        ></div>



        <!-- 카메라 상태 메시지 -->

        <div
          id="cameraMessage"
          class="camera-message"
        >

          카메라를 준비하고 있습니다.

        </div>


      </div>


    </section>



    <!-- =========================================================
         배경 선택
         ========================================================= -->

    <section class="selector-section">


      <h2 class="selector-title">

        배경을 선택해 주세요

      </h2>


      <!--
        backgrounds.js에서
        배경 버튼을 자동으로 생성합니다.
      -->

      <div
        id="backgroundList"
        class="background-list"
        role="list"
        aria-label="배경 선택"
      ></div>


    </section>



    <!-- =========================================================
         촬영 버튼
         ========================================================= -->

    <section class="capture-section">


      <button
        id="captureButton"
        class="capture-button"
        type="button"
        disabled
        aria-label="사진 촬영"
      >

        <span
          class="capture-button-inner"
        ></span>

      </button>


      <p class="capture-label">

        촬영

      </p>


    </section>



    <!-- =========================================================
         촬영 결과
         ========================================================= -->

    <section
      id="resultSection"
      class="result-section hidden"
    >


      <h2 class="result-title">

        촬영 결과

      </h2>



      <div class="result-image-wrapper">


        <img
          id="resultImage"
          class="result-image"
          alt="촬영된 사진"
        >


      </div>



      <div class="result-buttons">


        <!-- 다시 촬영 -->

        <button
          id="retryButton"
          class="secondary-button"
          type="button"
        >

          다시 찍기

        </button>



        <!-- PNG 저장 -->

        <button
          id="downloadButton"
          class="primary-button"
          type="button"
        >

          PNG 저장

        </button>


      </div>


    </section>



    <!-- =========================================================
         촬영 합성용 Canvas

         화면에는 보이지 않습니다.
         실제 PNG 생성에만 사용합니다.
         ========================================================= -->

    <canvas
      id="captureCanvas"
      class="hidden-canvas"
    ></canvas>


  </main>



  <!-- =========================================================
       JavaScript
       ========================================================= -->

  <script
    type="module"
    src="./js/app.js"
  ></script>


</body>

</html>
