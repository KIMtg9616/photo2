<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <title>캐릭터 포토</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >

</head>


<body>


  <main class="app">


    <!-- =========================================================
         상단 로고
         ========================================================= -->

    <header class="top-header">

      <img
        src="./assets/logo/logo.png"
        alt="희망의 과학싹잔치 로고"
        class="main-logo"
      >

    </header>



    <!-- =========================================================
         카메라
         ========================================================= -->

    <section class="camera-section">


      <div
        id="cameraStage"
        class="camera-stage"
      >


        <video
          id="cameraVideo"
          autoplay
          playsinline
          muted
        ></video>


        <img
          id="backgroundOverlay"
          class="background-overlay"
          alt=""
          aria-hidden="true"
        >


        <div
          id="cameraFlash"
          class="camera-flash"
          aria-hidden="true"
        ></div>


        <div
          id="cameraMessage"
          class="camera-message"
        >

          카메라를 준비하고 있습니다.

        </div>


      </div>


    </section>



    <!-- =========================================================
         배경 선택
         ========================================================= -->

    <section class="selector-section">


      <h2 class="selector-title">

        배경을 선택해 주세요

      </h2>


      <div
        id="backgroundList"
        class="background-list"
        role="list"
        aria-label="배경 선택"
      ></div>


    </section>



    <!-- =========================================================
         촬영 / 카메라 전환
         ========================================================= -->

    <section class="capture-section">


      <div class="capture-controls">


        <div
          class="capture-control-spacer"
          aria-hidden="true"
        ></div>



        <!-- 촬영 -->

        <div class="capture-main-control">


          <button
            id="captureButton"
            class="capture-button"
            type="button"
            disabled
            aria-label="사진 촬영"
          >

            <span
              class="capture-button-inner"
            ></span>

          </button>


          <p class="capture-label">

            촬영

          </p>


        </div>



        <!-- 카메라 전환 -->

        <div class="camera-switch-control">


          <button
            id="switchCameraButton"
            class="camera-switch-button"
            type="button"
            disabled
            aria-label="전면 및 후면 카메라 전환"
            title="카메라 전환"
          >


            <svg
              class="camera-switch-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >

              <path
                d="
                  M7.5 6.5
                  L9 4.5
                  H15
                  L16.5 6.5
                  H19
                  C20.1 6.5 21 7.4 21 8.5
                  V17
                  C21 18.1 20.1 19 19 19
                  H5
                  C3.9 19 3 18.1 3 17
                  V8.5
                  C3 7.4 3.9 6.5 5 6.5
                  Z
                "
              ></path>


              <circle
                cx="12"
                cy="12.5"
                r="3"
              ></circle>


              <path
                class="switch-arrow"
                d="
                  M8 10
                  C9 8.5 10.4 7.8 12 7.8
                  C13.1 7.8 14.1 8.1 15 8.8
                  L16.2 7.7
                  V11.3
                  H12.7
                  L14 10.1
                  C13.4 9.7 12.7 9.5 12 9.5
                  C10.9 9.5 10 10 9.4 10.8
                  Z
                "
              ></path>

            </svg>


          </button>


          <p class="camera-switch-label">

            전환

          </p>


        </div>


      </div>


    </section>



    <!-- =========================================================
         촬영 결과
         ========================================================= -->

    <section
      id="resultSection"
      class="result-section hidden"
    >


      <h2 class="result-title">

        촬영 결과

      </h2>


      <div class="result-image-wrapper">


        <img
          id="resultImage"
          class="result-image"
          alt="촬영된 사진"
        >


      </div>


      <div class="result-buttons">


        <button
          id="retryButton"
          class="secondary-button"
          type="button"
        >

          다시 찍기

        </button>


        <button
          id="downloadButton"
          class="primary-button"
          type="button"
        >

          PNG 저장

        </button>


      </div>


    </section>



    <!-- 촬영 합성용 Canvas -->

    <canvas
      id="captureCanvas"
      class="hidden-canvas"
    ></canvas>


  </main>



  <!-- =========================================================
       배경 선택 알림

       평상시에는 숨겨져 있습니다.
       배경을 선택하면 잠깐 나타났다가 자동으로 사라집니다.

       role="status" / aria-live:
       화면 읽기 프로그램에서도 선택 결과를 안내합니다.
       ========================================================= -->

  <div
    id="backgroundToast"
    class="background-toast"
    role="status"
    aria-live="polite"
    aria-atomic="true"
  ></div>



  <script
    type="module"
    src="./js/app.js"
  ></script>


</body>

</html>
